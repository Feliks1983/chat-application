<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Test</title>
    <link rel="shortcut icon" href="favicon.svg">
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background: #f5f5f5;
            color: #222;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
        }

        .panel {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .field {
            flex: 1 1 240px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input,
        textarea,
        button {
            font: inherit;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 88px;
            resize: vertical;
        }

        button {
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fafafa;
            cursor: pointer;
        }

        button:hover {
            background: #f0f0f0;
        }

        #status {
            font-weight: 700;
            margin-bottom: 12px;
        }

        #typing {
            min-height: 24px;
            color: #666;
            margin-top: 12px;
        }

        #messages,
        #events {
            display: grid;
            gap: 8px;
            max-height: 280px;
            overflow: auto;
        }

        .item {
            border: 1px solid #e1e1e1;
            border-radius: 6px;
            padding: 10px;
            background: #fcfcfc;
        }

        .meta {
            color: #666;
            font-size: 12px;
            margin-top: 4px;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            margin: 6px 0 0;
        }
    </style>
</head>
<body>
    <main>
        <section class="panel">
            <p>Use Postman for register/login and room creation. Paste JWT and room id here to test the assignment Socket.IO contract.</p>
            <div id="status">Disconnected</div>
            <div class="row">
                <div class="field">
                    <label for="tokenInput">JWT token</label>
                    <textarea id="tokenInput" placeholder="Paste JWT token from Postman"></textarea>
                </div>
            </div>
            <div class="row">
                <div class="field">
                    <label for="roomIdInput">Room ID</label>
                    <input type="text" id="roomIdInput" placeholder="Paste room id from Postman">
                </div>
                <div class="field">
                    <label for="messageIdInput">Message ID</label>
                    <input type="text" id="messageIdInput" placeholder="Optional, for message-read">
                </div>
            </div>
            <div class="row">
                <button type="button" id="connectButton">Connect</button>
                <button type="button" id="disconnectButton">Disconnect</button>
                <button type="button" id="joinButton">Join Room</button>
                <button type="button" id="leaveButton">Leave Room</button>
                <button type="button" id="readButton">Mark Read</button>
                <button id="createRoomButton">Create a Room</button>
            </div>
        </section>

        <section class="panel">
            <label for="messageInput">Message</label>
            <textarea id="messageInput" placeholder="Type a message..."></textarea>
            <div class="row">
                <button type="button" id="typingStartButton">Typing On</button>
                <button type="button" id="typingStopButton">Typing Off</button>
                <button type="button" id="sendButton">Send</button>
            </div>
            <div id="typing"></div>
        </section>

        <section class="panel">
            <h2>Messages</h2>
            <div id="messages"></div>
        </section>

        <section class="panel">
            <h2>Event Log</h2>
            <div id="events"></div>
        </section>
    </main>

    <script type="module" src="index.js"></script>
</body>
</html>
